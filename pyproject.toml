[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawn-autonomous-uav"
version = "0.2.0"
description = "Resilient autonomous UAV engineering project focused on GNC, sensor fusion, autonomous navigation and flight-system validation."
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]